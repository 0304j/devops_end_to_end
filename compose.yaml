# Local development and production-like runs.
#
#   npm run db:up          only the database (for `npm run dev`)
#   npm run docker:up      database + migrations + app container on :3000
#   npm run docker:down    stop everything (data stays in the volume)
#   docker compose --env-file .env.local down -v   stop and DELETE all local data
#
# Credentials come from .env.local (git-ignored, see .env.example). The npm
# scripts pass it with --env-file so ${POSTGRES_*} below can be resolved.

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    env_file: .env.local
    environment:
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to localhost only: the database is not reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies pending migrations, then exits.
  migrate:
    image: autocare:local
    build: .
    profiles: [app]
    env_file: .env.local
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-autocare}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-autocare}
    command: ["node", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "scripts/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy

  app:
    image: autocare:local
    build: .
    profiles: [app]
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-autocare}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-autocare}
      MOCK_NOTIFICATION_DIR: /tmp/notifications
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
